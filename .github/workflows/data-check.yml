name: Data Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-check:
    name: Data Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run data validator tests
        run: pytest tests/test_validate_data.py tests/test_image_processing.py tests/test_stage_processing.py tests/test_mod_processing.py

      - name: Validate repository external data
        run: python scripts/validate_data.py --project-root .

      - name: Audit licenses and bundled media provenance
        run: python scripts/audit_licenses.py --project-root .
