name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate, e.g. v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"
    branches:
      - "release-candidate-v*"

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release-gate:
    name: Release Gate / Source Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete development environment
        run: python -m pip install -e ".[dev]"

      - name: Resolve release candidate tag
        shell: bash
        run: |
          value="$RELEASE_REF"
          value="${value#release-candidate-}"
          echo "RELEASE_TAG=$value" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        run: python scripts/check_release_version.py --tag "$RELEASE_TAG"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile all Python
        run: python -m compileall -q src scripts tests

      - name: Run release lint
        run: ruff check src scripts tests

      - name: Run complete regression suite
        run: pytest

      - name: Run dedicated release E2E suite
        run: pytest tests/test_release_e2e.py tests/test_release_ui.py tests/test_release_blockers.py -q

      - name: Reject unresolved release blockers
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/check_release_blockers.py \
            --ledger release/known-issues.json \
            --expected-version "${VERSION}"

      - name: Validate every repository data asset
        run: python scripts/validate_data.py --project-root .

      - name: Audit licenses and bundled asset provenance
        run: python scripts/audit_licenses.py --project-root .

      - name: Exercise source smoke test
        run: python -m breakout_forge --smoke-test

      - name: Exercise source stage inputs
        run: |
          python -m breakout_forge --validate-stage standard_sample
          python -m breakout_forge --validate-stage sample
          python -m breakout_forge --validate-stage remove_background_sample
          python -m breakout_forge --validate-stage layered_sample
          python -m breakout_forge --validate-stage stages/sample/stage.json

      - name: Exercise machine-readable source probe
        run: |
          python -m breakout_forge --release-probe source-release-probe.json
          python - <<'PY'
          import json
          from breakout_forge import __version__

          data = json.load(open("source-release-probe.json", encoding="utf-8"))
          assert data["version"] == __version__
          assert data["smoke_test"] == "ok"
          assert data["validated_stages"] == [
              "standard_sample",
              "sample",
              "remove_background_sample",
              "layered_sample",
          ]
          assert data["loaded_mods"] == ["example_mod"]
          assert data["userdata_exists"] is True
          PY

  windows-release-gate:
    name: Release Gate / Windows Artifact
    runs-on: windows-latest
    timeout-minutes: 45
    needs: source-release-gate
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete development environment
        run: python -m pip install -e ".[dev]"

      - name: Resolve release candidate tag and verify version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_REF
          if ($tag.StartsWith("release-candidate-")) {
            $tag = $tag.Substring("release-candidate-".Length)
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          $version = (python scripts/check_release_version.py --tag "$tag").Trim()
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify dependency consistency on release OS
        run: python -m pip check

      - name: Run complete regression suite on release OS
        run: pytest

      - name: Run dedicated release E2E suite on Windows
        run: pytest tests/test_release_e2e.py tests/test_release_ui.py tests/test_release_blockers.py -q

      - name: Reject unresolved release blockers on Windows
        run: python scripts/check_release_blockers.py --ledger release/known-issues.json --expected-version "$env:RELEASE_VERSION"

      - name: Validate release data on Windows
        run: python scripts/validate_data.py --project-root .

      - name: Audit release licenses on Windows
        run: python scripts/audit_licenses.py --project-root .

      - name: Locate repository prebuilt Windows archive
        shell: pwsh
        run: |
          $zip = "prebuilt/windows-x64/BreakoutForge-v$env:RELEASE_VERSION-windows-x64.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) {
            throw "Repository prebuilt archive missing: $zip"
          }
          if (-not (Test-Path $sha)) {
            throw "Repository prebuilt checksum missing: $sha"
          }
          "PREBUILT_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PREBUILT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify repository prebuilt checksum
        shell: pwsh
        run: |
          $expected = (Get-Content "$env:PREBUILT_SHA").Split(" ")[0]
          $actual = (Get-FileHash -Algorithm SHA256 "$env:PREBUILT_ZIP").Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Repository prebuilt SHA-256 mismatch: expected=$expected actual=$actual"
          }

      - name: Extract repository prebuilt into clean directory
        shell: pwsh
        run: |
          $extract = "release-extract"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path "$env:PREBUILT_ZIP" -DestinationPath $extract

      - name: Verify exact repository prebuilt executable I/O
        run: python scripts/release_acceptance.py --dist-root release-extract/BreakoutForge --expected-version "$env:RELEASE_VERSION"

      - name: Capture deterministic UI review pack on release OS
        run: python scripts/capture_release_ui.py --project-root . --output release-ui

      - name: Tester A - deterministic visual regression
        run: python scripts/check_visual_baseline.py --images release-ui --baseline release/ui-visual-baseline-v1.0.0.json --expected-version "$env:RELEASE_VERSION"

      - name: Upload UI review pack
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-review-pack
          path: release-ui/
          if-no-files-found: error
          retention-days: 30

      - name: Upload gated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: breakout-forge-${{ env.RELEASE_TAG }}-release-candidate
          path: |
            prebuilt/windows-x64/BreakoutForge-v*-windows-x64.zip
            prebuilt/windows-x64/BreakoutForge-v*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  ai-ui-review:
    name: Release Gate / AI UI Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - windows-release-gate
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CI_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release review scripts
        uses: actions/checkout@v4

      - name: Download UI review pack
        uses: actions/download-artifact@v4
        with:
          name: release-ui-review-pack
          path: release-ui

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GitHub Copilot SDK
        run: npm install --no-save @github/copilot-sdk

      - name: Tester B - GPT-5 mini UI/UX review
        env:
          UI_REVIEW_MODEL: gpt-5-mini
          UI_REVIEW_NAME: Tester B / GPT-5 mini
          UI_REVIEW_RUBRIC: >-
            Review readability, hierarchy, overlap, spacing, state clarity,
            score/ball/paddle/block visibility, and whether READY, PLAYING,
            CLEAR and GAME OVER are immediately understandable.
        run: node scripts/ci_ui_vision_review.mjs release-ui tester-b-review.json

      - name: Tester C - Claude Sonnet 4.6 independent review
        env:
          UI_REVIEW_MODEL: claude-sonnet-4.6
          UI_REVIEW_NAME: Tester C / Claude Sonnet 4.6
          UI_REVIEW_RUBRIC: >-
            Review as a first-time user. Focus on misleading UI, clipping,
            contrast, state-to-state inconsistencies, subtle rendering defects,
            whether image/background-removal/layered states are distinguishable,
            and anything that could be mistaken for corruption or missing content.
        run: node scripts/ci_ui_vision_review.mjs release-ui tester-c-review.json

      - name: Upload AI UI review evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-ai-ui-review
          path: |
            tester-b-review.json
            tester-c-review.json
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Release Gate / Publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - source-release-gate
      - windows-release-gate
      - ai-ui-review
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout release evidence
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require project-owner manual UI approval
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/check_ui_review.py \
            --report "release/ui-review-${VERSION}.json" \
            --expected-version "${VERSION}" \
            --manual-only

      - name: Download gated release candidate
        uses: actions/download-artifact@v4
        with:
          name: breakout-forge-${{ env.RELEASE_TAG }}-release-candidate
          path: release-assets

      - name: Publish GitHub Release only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Breakout Forge $RELEASE_TAG" \
            --generate-notes
