[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-forge"
dynamic = ["version"]
description = "A small extensible breakout game foundation with image stages, layered destruction and mod support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pygame>=2.6,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.10,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
breakout-forge = "breakout_forge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


[tool.setuptools.dynamic]
version = {attr = "breakout_forge.__version__"}
